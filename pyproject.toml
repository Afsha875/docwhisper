[project]
name = "docwhisper"
version = "0.1.0"
description = "Local semantic search over your documents: index a folder of PDFs/markdown/text, search it, ask it questions — no cloud, no server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.3.6",
    "numpy>=1.26",
    "pypdf>=4.2",
    "httpx>=0.27",
]

[project.scripts]
docwhisper = "docwhisper.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
